<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="CSS/Header_NAV.css">
    <link rel="stylesheet" href="CSS/Menu_Catogary.css">
    <link re="stylesheet" href="CSS/Food_Items_Grid.css">

<title>Café Delight - By Nithum Sandro</title>
<style>html{
scroll-behavior:smooth;
}</style>
</head>
<body>
    <header>
        <h1 class="Logo">CAFÉ  DELIGHT</h1>
        <div class="search-container">
            <input type="text" class="search-bar" id="searchBar" placeholder="Search Here">
            <div class="suggestions" id="suggestions"></div>
            <img src="search-icon.png" class="search-icon" alt="search-icon">
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
    </nav>

    <main>
        <h1 class="Header" id="header">Cart</h1>
        <div class="Receipt" id="Receipt_Area">
        <h1 class="receipt_logo" id="receipt_logo"></h1>
        <div class="Receipt_Top" id="Receipt_Top_Area"></div>

<p id="grandTotal"></p>

<script>
function loadCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let container = document.getElementById("Receipt_Top_Area");
    let grandTotal = 0;

    container.innerHTML = "";

    cart.forEach((item, index) => {
        grandTotal += item.total;

        container.innerHTML += `
            <div style="display:flex; align-items:center; margin-bottom:10px; border-bottom:1px solid #ccc; padding:10px;">
                <img src="${item.image}" width="80" height="80">
                <div style="margin-left:10px;">
                    <h3>${item.name}</h3>
                    <p>Price: $${item.price}</p>
                    <p>Qty: ${item.quantity}</p>
                    <p>Total: $${item.total}</p>

                    <button onclick="removeItem(${index})">Remove</button>
                </div>
            </div>
        `;
    });

    document.getElementById("grandTotal").innerText =
        "Grand Total: $" + grandTotal.toFixed(2);
}

function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    loadCart();
}

loadCart();

</script>
